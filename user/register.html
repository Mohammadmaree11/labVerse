<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <!-- tailwind css 4.3 -->
    <link rel="stylesheet" href="../assets/css/output.css">
</head>

<body>
    <section class="  py-15">
        <div class="container px-2 md:px-35">
            <div class="mx-auto grid  border rounded-3xl grid-cols-1 bg-white lg:grid-cols-2">
                <!--? <<<<<<<1>>>>> -->
                <div class="flex items-center justify-center p-8 md:p-12">
                    <div class="w-full max-w-md">
                        <h2 class="text-center md:text-left text-2xl md:text-3xl font-bold">Create Your Account</h2>
                        <p class="my-6 text-sm ">Join the community of medical laboratory professionals.
                        </p>
                        <!--? <<<<<<<form>>>>> -->
                        <form class="flex flex-col gap-4">
                            <div>
                                <label for="name" class="cursor-pointer  mb-2 block text-sm font-medium">Full
                                    Name</label>
                                <input id="name" type="text" placeholder="Dr. John Doe" class="w-full rounded-lg border border-lightGrey
                                       px-4 py-3 text-sm outline-none bg-Background
                                       focus:border-Primary ">
                            </div>
                            <div>
                                <label for="email" class="cursor-pointer  mb-2 block text-sm font-medium">Email
                                    Address</label>
                                <input id="email" type="email" placeholder="scientist@example.com" class="w-full rounded-lg border border-lightGrey
                                       px-4 py-3 text-sm outline-none bg-Background
                                       focus:border-Primary ">
                            </div>
                       
                            <!--? <<<<<<<level>>>>> -->
                            <div>
                                <label for="level" class="mb-2 block text-sm font-medium">
                                    Academic Level
                                </label>
                                <select id="level"
                                    class="w-full rounded-lg border border-lightGrey bg-Background px-4 py-3 text-sm outline-none   focus:border-Primary focus:ring-1 focus:ring-Primary">
                                    <option value="" selected disabled>Select your level</option>
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                            <!--? <<<<<<<interest>>>>> -->
                            <div>
                                <label for="interest" class="mb-2 block text-sm font-medium">
                                    Primary Interest
                                </label>

                                <select id="interest"
                                    class="bg-Background w-full rounded-lg border border-lightGrey px-4 py-3 text-sm outline-none focus:border-Primary focus:ring-1 focus:ring-Primary">
                                    <option value="" selected disabled>Select an area of interest</option>
                                    <option>Hematology</option>
                                    <option>Clinical Chemistry</option>
                                    <option>Microbiology</option>
                                    <option>Coagulation</option>
                                    <option>Immunology</option>
                                    <option>Other</option>
                                </select>
                            </div>
                                 <div>
                                <div class="mb-2 row justify-between  ">
                                    <label for="password" class="cursor-pointer  text-sm font-medium">Password</label>                           
                                </div>
                                <div class="row bg-Background rounded-lg border border-lightGrey px-4 ">
                                    <input id="password" type="password" placeholder="••••••••" class="w-full bg-transparent py-3 text-sm
                                           outline-none border-none 
                                          ">
                                    <img src="../assets/images/login file/hidden.svg" alt="Show password"
                                        class="h-5 w-5 cursor-pointer">
                                </div>
                            </div>
                            <button type="submit" class="w-full rounded-lg bg-Primary py-3
                                   font-semibold text-white
                                   transition-all duration-300
                                   hover:scale-102 hover:bg-Bluer">
                                Create Account

                            </button>
                          
                            <p class="text-center text-sm text-gray-500">Already have an account?
                                <a href="./login.html" class="text-Primary hover:underline hover:text-Secondary">
                                    LOGIN
                                </a>
                            </p>
                        </form>
                    </div>
                </div>
                <!--? <<<<<<<2>>>>> -->
                <div class=" rounded-3xl  hidden lg:block">
                    <img src="../assets/images/register file/register.webp" alt="Register"
                        class="w-full h-full bg-cover   rounded-3xl">

                </div>

            </div>

        </div>
    </section>
</body>

</html>
